name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit and regression tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Setup Python for validation API tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend unit-test dependency
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Test dbt Core validation API orchestration (mocked subprocesses)
        run: python -m unittest discover -s server -p 'test_*.py'
